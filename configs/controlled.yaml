# Configuration for Controlled Synthetic Scenarios (Conflict, Temporal Evolution, Multi-Hop)
seed: 42

claim_processing:
  enable_decomposition: true
  min_tokens_for_split: 8

retrieval:
  corpus_path: "data/controlled/corpus.jsonl"
  bm25_index_path: "data/controlled/indexes/bm25.pkl"
  dense_index_path: "data/controlled/indexes/dense_index.pt"
  dense_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  retrieval_mode: "hybrid"  # "bm25", "dense", or "hybrid"
  top_k_candidates: 20
  hybrid_weight_bm25: 0.5
  hybrid_weight_dense: 0.5
  device: "auto"

evidence_granularity:
  enabled: true
  unit: "sentence"
  max_sentences_per_passage: 1
  max_characters: 400
  min_characters: 15

reranking:
  enabled: true
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5
  device: "auto"

nli:
  model_name: "models/distilbert-base-uncased-mnli"
  batch_size: 16
  max_length: 256
  device: "auto"

temporal:
  enabled: true
  outdated_penalty: 0.3
  future_mismatch_penalty: 0.5

conflict:
  enabled: true
  balance_threshold: 0.3
  conflict_uncertainty_scale: 0.4

aggregation:
  method: "relevance_weighted"
  pooling_mode: "document_aware"
  relevance_temperature: 1.0

uncertainty:
  entropy_weight: 0.35
  conflict_weight: 0.35
  retrieval_deficit_weight: 0.20
  temporal_penalty_weight: 0.10

thresholds:
  confidence: 0.65
  abstention_uncertainty: 0.40
  contradiction_ratio: 0.60

reasoning:
  llm_enabled: false
  provider: "mock"
  api_key_env_var: "GEMINI_API_KEY"
  model: "gemini-1.5-flash"
  timeout_seconds: 15
  retry_count: 2
